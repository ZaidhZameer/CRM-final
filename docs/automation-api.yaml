openapi: 3.1.0
info:
  title: FlowLead <-> n8n Automation API
  version: 1.0.0
  description: |
    The contract between FlowLead (this Next.js app) and the n8n Lead Enrichment
    Pipeline. Every message in both directions uses one envelope:
    `event_id`, `event_type`, `organization_id`, `subject_id`, optional
    `correlation_id` (on a reply: the request's event_id) and `expected_version`,
    plus a type-specific `payload`.

    Source of truth: `src/lib/automation/contract.ts`. The JSON Schemas in
    `docs/contracts/` are generated from it (`pnpm contracts:export`) and a test
    fails if they drift. n8n validates outgoing messages against the same shapes.

      1. OUTBOUND — FlowLead sends `lead.enrichment.requested` when a lead is created
         (web form, CSV import, booking page) and records a job. Fire-and-forget:
         lead creation succeeds regardless of whether n8n responds.
      2. INBOUND  — n8n POSTs `lead.enriched` to `POST /api/automation/result`,
         which stores the research and closes the job.

    ## Authentication
    Both directions use the same shared secret, sent in the `x-flowlead-secret`
    header. It is **never** placed in a query string. The inbound route compares it
    timing-safely and **fails closed**: if `AUTOMATION_SHARED_SECRET` is unset or
    shorter than 16 characters, every request is rejected with 503.

    The `/api/cron/*` routes follow the same rules with their own `x-cron-secret`
    header and `CRON_SECRET`.

    ## Idempotency
    Every event carries an `event_id` (UUID) generated by the emitter. The inbound
    route claims it by inserting into `public.automation_events` (primary key) before
    doing any other write, so a redelivery of the same `event_id` returns
    `{"ok": true, "duplicate": true}` and writes nothing.

    ## Multi-tenancy
    `organization_id` is part of every WHERE clause, not merely trusted from the
    payload. A mismatched `organization_id` yields `404 lead_not_found` — it can
    never reach another tenant's row.

servers:
  - url: https://{host}
    description: FlowLead deployment
    variables:
      host:
        default: app.flowlead.example

tags:
  - name: inbound
    description: Endpoints FlowLead exposes to n8n
  - name: outbound
    description: Requests FlowLead makes to the n8n adapter (documented, not served here)

paths:
  /api/automation/result:
    post:
      tags: [inbound]
      operationId: postAutomationResult
      summary: Receive a lead-enrichment result from n8n
      description: |
        Writes one row to `research_reports` and applies a narrow, version-guarded
        transition to the `leads` row.

        The lead update is **skipped, not forced**, when:
          * the lead's status is one a human already decided
            (`converted`, `lost`, `unqualified`) → `outcome: skipped_terminal_status`
          * the `version` no longer matches → `outcome: skipped_version_conflict`

        In both cases the research report is still stored and the call is a 200.
      security:
        - FlowLeadSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './contracts/lead.enriched.schema.json'
            example:
              event_id: 1d8b2b3e-6a4f-4a2c-9a3f-2f1c0d9e8b77
              event_type: lead.enriched
              organization_id: 0b5c1f9a-2f3e-4c1a-9f10-6d2b7e4a8c31
              subject_id: 8f2a7c44-91b2-4f55-b0de-3a6c9e1d2f40
              correlation_id: 4c9d2e11-77a0-4b6e-9d3a-15c7b8e2f904
              expected_version: 1
              payload:
                research:
                  tier: standard
                  status: completed
                  company_summary: 42-person Manchester plumbing firm, trade + domestic.
                  pain_points: ['No after-hours cover', 'Enquiries lost to voicemail']
                  next_best_action: Book a 15-minute discovery call
                  lead_score: 78
                  confidence_score: 0.82
                lead_update:
                  lead_score: 78
                  lead_quality: warm
      responses:
        '200':
          description: |
            Processed, or recognised as a duplicate. Always inspect `outcome` — a 200
            does not guarantee the lead row was changed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AutomationResultOk'
                  - $ref: '#/components/schemas/AutomationResultDuplicate'
        '400':
          description: Malformed JSON or payload that failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPayload:
                  value:
                    ok: false
                    error: invalid_payload
                    issues:
                      - path: payload.research.lead_score
                        message: 'Too big: expected number to be <=100'
        '401':
          description: Missing or incorrect `x-flowlead-secret`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { ok: false, error: unauthorized }
        '404':
          description: |
            No live lead matches `lead_id` **within** `organization_id`. Also returned
            when the lead is soft-deleted. Deliberately indistinguishable from a
            cross-tenant lookup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { ok: false, error: lead_not_found }
        '500':
          description: Internal failure. Body carries no internals; details are logged server-side.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { ok: false, error: internal_error }
        '503':
          description: |
            `AUTOMATION_SHARED_SECRET` is not configured, so the endpoint is disabled.
            This is the fail-closed path — an unset secret rejects rather than admits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { ok: false, error: automation_disabled }

  /webhook/flowlead/lead-enrichment:
    post:
      tags: [outbound]
      operationId: requestLeadEnrichment
      summary: '(n8n side) FlowLead requests lead research'
      description: |
        **Not served by this app.** FlowLead POSTs this to `N8N_ADAPTER_URL` after a
        lead row is committed, with `x-flowlead-secret`, and records a `jobs` row
        keyed on `event_id`.

        n8n replies `202` as soon as the request is authenticated and claimed, then
        researches in the background and delivers `lead.enriched` (with
        `correlation_id` = this `event_id`) to `/api/automation/result`.
        FlowLead waits at most 8 seconds for the 202; a timeout, non-2xx or network
        failure marks the job `failed`. The lead always survives.
      security:
        - FlowLeadSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './contracts/lead.enrichment.requested.schema.json'
            example:
              event_id: 4c9d2e11-77a0-4b6e-9d3a-15c7b8e2f904
              event_type: lead.enrichment.requested
              organization_id: 0b5c1f9a-2f3e-4c1a-9f10-6d2b7e4a8c31
              subject_id: 8f2a7c44-91b2-4f55-b0de-3a6c9e1d2f40
              payload:
                full_name: Sam Okafor
                company_name: Okafor Plumbing Ltd
                website: https://okaforplumbing.co.uk
      responses:
        '202':
          description: Accepted; research runs in the background. The job moves to `running`.
        '401':
          description: Shared secret rejected. The job moves to `failed`.

components:
  securitySchemes:
    FlowLeadSecret:
      type: apiKey
      in: header
      name: x-flowlead-secret
      description: |
        Shared secret, minimum 16 characters. Header only — never a query parameter.
        Compared with a constant-time comparison. Unset means "reject", not "allow".

  schemas:
    Outcome:
      type: string
      enum:
        - applied
        - skipped_terminal_status
        - skipped_version_conflict
        - research_only
      description: |
        * `applied` — research stored and the lead row updated.
        * `skipped_terminal_status` — a human had already marked the lead
          converted / lost / unqualified; research stored, lead untouched.
        * `skipped_version_conflict` — the lead changed underneath us; research
          stored, lead untouched. n8n may re-read and retry with a new `event_id`.
        * `research_only` — no lead update was requested.

    AutomationResultOk:
      type: object
      required: [ok, duplicate, event_id, lead_id, research_report_id, outcome]
      properties:
        ok: { type: boolean, enum: [true] }
        duplicate: { type: boolean, enum: [false] }
        event_id: { type: string, format: uuid }
        lead_id: { type: string, format: uuid }
        research_report_id: { type: string, format: uuid }
        outcome: { $ref: '#/components/schemas/Outcome' }

    AutomationResultDuplicate:
      type: object
      required: [ok, duplicate, event_id]
      properties:
        ok: { type: boolean, enum: [true] }
        duplicate: { type: boolean, enum: [true] }
        event_id: { type: string, format: uuid }

    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, enum: [false] }
        error:
          type: string
          enum:
            - automation_disabled
            - unauthorized
            - invalid_json
            - invalid_payload
            - lead_not_found
            - internal_error
          description: Stable machine-readable code. No internal detail is ever leaked.
        issues:
          type: array
          description: Present only for `invalid_payload`.
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }
