openapi: 3.0.3
info:
  title: FlowLead <-> n8n Automation API
  version: 1.0.0
  description: |
    The contract between FlowLead (this Next.js app) and the n8n "FlowLead Adapter"
    workflow. Two directions:

      1. OUTBOUND — FlowLead emits `lead.created` to the n8n adapter whenever a lead
         is created (web form conversion, CSV import, booking page). Fire-and-forget:
         lead creation succeeds regardless of whether n8n responds.
      2. INBOUND  — n8n POSTs enrichment results back to `POST /api/automation/result`.

    ## Authentication
    Both directions use the same shared secret, sent in the `x-flowlead-secret`
    header. It is **never** placed in a query string. The inbound route compares it
    timing-safely and **fails closed**: if `AUTOMATION_SHARED_SECRET` is unset or
    shorter than 16 characters, every request is rejected with 503.

    (Note: the pre-existing `/api/cron/*` routes use a `?key=` query param and fail
    OPEN when `CRON_SECRET` is unset. That is a separate known issue, not this
    contract.)

    ## Idempotency
    Every event carries an `event_id` (UUID) generated by the emitter. The inbound
    route claims it by inserting into `public.automation_events` (primary key) before
    doing any other write, so a redelivery of the same `event_id` returns
    `{"ok": true, "duplicate": true}` and writes nothing.

    ## Multi-tenancy
    `organization_id` is part of every WHERE clause, not merely trusted from the
    payload. A mismatched `organization_id` yields `404 lead_not_found` — it can
    never reach another tenant's row.

servers:
  - url: https://{host}
    description: FlowLead deployment
    variables:
      host:
        default: app.flowlead.example

tags:
  - name: inbound
    description: Endpoints FlowLead exposes to n8n
  - name: outbound
    description: Requests FlowLead makes to the n8n adapter (documented, not served here)

paths:
  /api/automation/result:
    post:
      tags: [inbound]
      operationId: postAutomationResult
      summary: Receive a lead-enrichment result from n8n
      description: |
        Writes one row to `research_reports` and applies a narrow, version-guarded
        transition to the `leads` row.

        The lead update is **skipped, not forced**, when:
          * the lead's status is one a human already decided
            (`converted`, `lost`, `unqualified`) → `outcome: skipped_terminal_status`
          * the `version` no longer matches → `outcome: skipped_version_conflict`

        In both cases the research report is still stored and the call is a 200.
      security:
        - FlowLeadSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadEnrichedEvent'
            examples:
              completed:
                summary: Successful enrichment
                value:
                  event_id: 1d8b2b3e-6a4f-4a2c-9a3f-2f1c0d9e8b77
                  event_type: lead.enriched
                  organization_id: 0b5c1f9a-2f3e-4c1a-9f10-6d2b7e4a8c31
                  lead_id: 8f2a7c44-91b2-4f55-b0de-3a6c9e1d2f40
                  expected_version: 1
                  research:
                    tier: standard
                    status: completed
                    company_summary: 42-person Manchester plumbing firm, trade + domestic.
                    website_analysis: WordPress site, no online booking, phone-first CTA.
                    pain_points: ['No after-hours cover', 'Enquiries lost to voicemail']
                    recommended_offer: After-hours overflow triage
                    outreach_angle: Missed calls outside 9-5
                    objections: ['Already have an answering service']
                    next_best_action: Book a 15-minute discovery call
                    lead_score: 78
                    confidence_score: 0.82
                    model: claude-sonnet-4
                  lead_update:
                    lead_score: 78
                    lead_quality: warm
                    ai_status: completed
      responses:
        '200':
          description: |
            Processed, or recognised as a duplicate. Always inspect `outcome` — a 200
            does not guarantee the lead row was changed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AutomationResultOk'
                  - $ref: '#/components/schemas/AutomationResultDuplicate'
        '400':
          description: Malformed JSON or payload that failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPayload:
                  value:
                    ok: false
                    error: invalid_payload
                    issues:
                      - path: research.lead_score
                        message: Too big: expected number to be <=100
        '401':
          description: Missing or incorrect `x-flowlead-secret`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { ok: false, error: unauthorized }
        '404':
          description: |
            No live lead matches `lead_id` **within** `organization_id`. Also returned
            when the lead is soft-deleted. Deliberately indistinguishable from a
            cross-tenant lookup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { ok: false, error: lead_not_found }
        '500':
          description: Internal failure. Body carries no internals; details are logged server-side.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { ok: false, error: internal_error }
        '503':
          description: |
            `AUTOMATION_SHARED_SECRET` is not configured, so the endpoint is disabled.
            This is the fail-closed path — an unset secret rejects rather than admits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { ok: false, error: automation_disabled }

  /webhook/flowlead-adapter:
    post:
      tags: [outbound]
      operationId: emitLeadCreated
      summary: '(n8n side) FlowLead emits lead.created'
      description: |
        **Not served by this app.** Documented here because it is the other half of
        the contract. FlowLead POSTs this to `N8N_ADAPTER_URL` after a lead row is
        committed, with `x-flowlead-secret`.

        Delivery semantics: at-most-once, fire-and-forget, 8-second timeout, scheduled
        via `after()` so it never blocks the user's response. A non-2xx or a network
        failure is logged and dropped — the lead still exists. n8n must therefore
        treat a missing event as possible and tolerate replays keyed on `event_id`.
      security:
        - FlowLeadSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadCreatedEvent'
            example:
              event_id: 4c9d2e11-77a0-4b6e-9d3a-15c7b8e2f904
              event_type: lead.created
              organization_id: 0b5c1f9a-2f3e-4c1a-9f10-6d2b7e4a8c31
              lead_id: 8f2a7c44-91b2-4f55-b0de-3a6c9e1d2f40
              full_name: Sam Okafor
              company_name: Okafor Plumbing Ltd
              website: https://okaforplumbing.co.uk
      responses:
        '200':
          description: Adapter accepted the event. FlowLead ignores the body.
        '401':
          description: Adapter rejected the shared secret.

components:
  securitySchemes:
    FlowLeadSecret:
      type: apiKey
      in: header
      name: x-flowlead-secret
      description: |
        Shared secret, minimum 16 characters. Header only — never a query parameter.
        Compared with a constant-time comparison. Unset means "reject", not "allow".

  schemas:
    LeadCreatedEvent:
      type: object
      required: [event_id, event_type, organization_id, lead_id]
      additionalProperties: false
      properties:
        event_id:
          type: string
          format: uuid
          description: Idempotency key, generated per emit.
        event_type:
          type: string
          enum: [lead.created]
        organization_id:
          type: string
          format: uuid
        lead_id:
          type: string
          format: uuid
        full_name:
          type: string
          nullable: true
          description: Contact name as captured; null when unknown.
        company_name:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
          description: Null for sources that do not collect a website (e.g. booking page).

    LeadEnrichedEvent:
      type: object
      required: [event_id, event_type, organization_id, lead_id, research]
      properties:
        event_id:
          type: string
          format: uuid
          description: |
            Idempotency key. Reusing one returns `duplicate: true` and writes nothing.
            Must be a *new* UUID per enrichment result, not the `lead.created` id.
        event_type:
          type: string
          enum: [lead.enriched]
        organization_id:
          type: string
          format: uuid
        lead_id:
          type: string
          format: uuid
        expected_version:
          type: integer
          minimum: 1
          description: |
            The `leads.version` n8n observed. When supplied it is enforced as an
            optimistic lock; when omitted the version read at processing time is used
            (still guarded against a concurrent writer).
        research:
          $ref: '#/components/schemas/ResearchPayload'
        lead_update:
          $ref: '#/components/schemas/LeadUpdatePayload'

    ResearchPayload:
      type: object
      description: |
        Maps onto `public.research_reports`. Note the column names are `tier` and
        `status` (enums `public.research_tier` / `public.research_status`).
      properties:
        tier:
          type: string
          enum: [basic, standard, deep]
          default: basic
        status:
          type: string
          enum: [pending, running, completed, failed]
          default: completed
        company_summary: { type: string, nullable: true, maxLength: 20000 }
        website_analysis: { type: string, nullable: true, maxLength: 20000 }
        pain_points:
          type: array
          nullable: true
          maxItems: 50
          items: { type: string, maxLength: 2000 }
          description: Stored as `pain_points_json`.
        recommended_offer: { type: string, nullable: true, maxLength: 5000 }
        outreach_angle: { type: string, nullable: true, maxLength: 5000 }
        objections:
          type: array
          nullable: true
          maxItems: 50
          items: { type: string, maxLength: 2000 }
          description: Stored as `objections_json`.
        next_best_action: { type: string, nullable: true, maxLength: 5000 }
        lead_score: { type: integer, nullable: true, minimum: 0, maximum: 100 }
        confidence_score: { type: number, nullable: true, minimum: 0, maximum: 1 }
        model: { type: string, nullable: true, maxLength: 200 }
        error_message:
          type: string
          nullable: true
          maxLength: 2000
          description: Populate together with `status: failed`.

    LeadUpdatePayload:
      type: object
      description: |
        Optional. Present means "attempt the guarded lead transition". Omitting it
        entirely, with no `research.lead_score`, stores the report only
        (`outcome: research_only`). `status` and `pipeline_stage` are intentionally
        NOT settable from automation — a human owns those.
      additionalProperties: false
      properties:
        lead_score: { type: integer, minimum: 0, maximum: 100 }
        lead_quality: { type: string, enum: [hot, warm, cold] }
        ai_status: { type: string, enum: [pending, running, completed, failed] }

    Outcome:
      type: string
      enum:
        - applied
        - skipped_terminal_status
        - skipped_version_conflict
        - research_only
      description: |
        * `applied` — research stored and the lead row updated.
        * `skipped_terminal_status` — a human had already marked the lead
          converted / lost / unqualified; research stored, lead untouched.
        * `skipped_version_conflict` — the lead changed underneath us; research
          stored, lead untouched. n8n may re-read and retry with a new `event_id`.
        * `research_only` — no lead update was requested.

    AutomationResultOk:
      type: object
      required: [ok, duplicate, event_id, lead_id, research_report_id, outcome]
      properties:
        ok: { type: boolean, enum: [true] }
        duplicate: { type: boolean, enum: [false] }
        event_id: { type: string, format: uuid }
        lead_id: { type: string, format: uuid }
        research_report_id: { type: string, format: uuid }
        outcome: { $ref: '#/components/schemas/Outcome' }

    AutomationResultDuplicate:
      type: object
      required: [ok, duplicate, event_id]
      properties:
        ok: { type: boolean, enum: [true] }
        duplicate: { type: boolean, enum: [true] }
        event_id: { type: string, format: uuid }

    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, enum: [false] }
        error:
          type: string
          enum:
            - automation_disabled
            - unauthorized
            - invalid_json
            - invalid_payload
            - lead_not_found
            - internal_error
          description: Stable machine-readable code. No internal detail is ever leaked.
        issues:
          type: array
          description: Present only for `invalid_payload`.
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }
